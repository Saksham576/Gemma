<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sak Shorts studio</title>
<style>
  @font-face { font-family: 'Permanent Marker'; src: url(assets/fonts/PermanentMarker.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Shantell Sans'; font-weight: 800; src: url(assets/fonts/ShantellSans-800.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500 700; src: url(assets/fonts/PlusJakartaSans.woff2) format('woff2'); font-display: block; }
  @font-face { font-family: 'Instrument Serif'; src: url(assets/fonts/InstrumentSerif.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; justify-items: start; }
  #out { height: min(86vh, 960px); aspect-ratio: 9 / 16; width: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; width: 540px; }
  #scrub { flex: 1; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
<script src="node_modules/tone/build/Tone.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1080" height="1920"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="20" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<script src="src/config.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/audio.js"></script>
<!-- the three Shorts: each file registers its shots and sound only when it is the selected SHORT -->
<script src="src/scenes/cast.js"></script>
<script src="src/scenes/s1_toast.js"></script>
<script src="src/scenes/s2_tower.js"></script>
<script src="src/scenes/s3_cloud.js"></script>
</body>
</html>
